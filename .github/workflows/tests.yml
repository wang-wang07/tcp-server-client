name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            package: g++
            compiler: g++
            cmake_args: ""
          - name: Clang
            package: clang libc++-dev libc++abi-dev
            compiler: clang++
            cmake_args: -DCMAKE_CXX_FLAGS=-stdlib=libc++
          # Run identical tests with memory and undefined-behavior instrumentation.
          - name: GCC sanitizers
            package: g++
            compiler: g++
            cmake_args: >-
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.package }} perl

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          # Uninstrumented builds ignore these options.
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure
